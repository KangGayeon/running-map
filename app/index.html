<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>러닝 내비</title>
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="러닝 내비">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 어두운 러닝 앱 테마: 검정 카드 + 형광 라임 포인트 */
  :root {
    --bg: #0e0f11; --card: #1a1c1f; --card-2: #24272b; --line: #2e3237;
    --ink: #f3f4f5; --ink-2: #9aa0a6; --ink-3: #6b7177;
    --lime: #c8f25b; --lime-ink: #10120a; --danger: #ff6b6b;
    --glass: rgba(20, 22, 25, .78);
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
  body { overflow: hidden; -webkit-tap-highlight-color: transparent; }
  #map { position: fixed; inset: 0; background: #111315; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  button:focus-visible, select:focus-visible + .pill-ui { outline: 2px solid var(--lime); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  small { color: var(--ink-2); }

  .screen { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
  .screen > * { pointer-events: auto; }
  .top { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0; }
  .glass { background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.06); }
  .iconbtn { width: 44px; height: 44px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 22px; }

  /* ---- 홈 ---- */
  .home-top { flex-direction: column; align-items: stretch; gap: 0; padding-bottom: 14px;
    background: linear-gradient(var(--bg) 55%, rgba(14,15,17,0)); }
  .home-top .date { font-size: 12px; color: var(--ink-2); }
  .home-top h1 { margin: 2px 0 10px; font-size: 26px; font-weight: 800; letter-spacing: -.03em; }
  .pill { position: relative; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px;
    border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 15px; font-weight: 600; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); flex: none; }
  .pill span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill select { position: absolute; inset: 0; width: 100%; opacity: 0; font-size: 16px; cursor: pointer; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto;
    background: var(--bg); border-radius: 28px 28px 0 0; padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    box-shadow: 0 -10px 40px rgba(0,0,0,.5); }
  .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 12px; }
  .sec { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 10px; }
  .sec h2 { margin: 0; font-size: 15px; font-weight: 700; }
  .seg { display: flex; background: var(--card); border-radius: 10px; padding: 3px; font-size: 12px; }
  .seg button { padding: 5px 10px; border-radius: 8px; color: var(--ink-2); font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--card-2); color: var(--ink); }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tile { background: var(--card); border-radius: 16px; padding: 10px 10px 9px; min-width: 0; }
  .tile i { font-style: normal; font-size: 11px; color: var(--ink-2); display: block; white-space: nowrap; }
  .tile b { display: block; margin-top: 6px; font-size: 19px; font-weight: 800; }
  .tile b em { font-style: normal; font-size: 11px; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--ink-2); margin: 10px 2px 14px; }
  .legend i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card);
    border-radius: 18px; padding: 12px; margin-bottom: 8px; }
  .row:disabled { opacity: .45; cursor: default; }
  .row .ic { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--card-2); font-size: 20px; }
  .row .ic.lime { background: var(--lime); color: var(--lime-ink); }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { display: block; font-size: 15px; font-weight: 700; }
  .row .t small { display: block; font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .go { width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--card-2); display: grid; place-items: center; color: var(--ink-2); }

  /* ---- 코스 ---- */
  .course-head { flex: 1; min-width: 0; height: 44px; border-radius: 14px; display: flex; flex-direction: column; justify-content: center; padding: 0 14px; }
  .course-head b { font-size: 15px; } .course-head small { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cards { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; display: grid; gap: 8px;
    padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
  .cards .r { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; }
  .cards .r.b { grid-template-columns: 1.6fr 1fr; }
  .cc { background: var(--card); border-radius: 18px; padding: 12px 14px; min-width: 0; }
  .cc .ico { font-size: 16px; color: var(--ink-2); }
  .cc b { display: block; margin-top: 6px; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cc small { display: block; font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .start { border-radius: 18px; background: var(--lime); color: var(--lime-ink); font-weight: 800; font-size: 17px; letter-spacing: .04em;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 0 30px rgba(200,242,91,.25); }
  .start small { color: rgba(16,18,10,.6); font-size: 11px; font-weight: 600; letter-spacing: 0; }
  .kmtag { background: #fff; color: #111; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px;
    box-shadow: 0 2px 8px rgba(0,0,0,.4); white-space: nowrap; pointer-events: none; }
  .pin { width: 14px; height: 14px; border-radius: 50%; background: var(--lime); border: 3px solid #111; box-shadow: 0 0 0 2px var(--lime); pointer-events: none; }
  .pin.end { background: #fff; box-shadow: 0 0 0 2px #fff; }

  /* ---- 달리는 중 ---- */
  .tcard { flex: 1; display: flex; align-items: center; gap: 12px; border-radius: 18px; padding: 10px 14px; min-width: 0; }
  .tcard .arrow { width: 40px; height: 40px; flex: none; border-radius: 12px; background: var(--lime); color: var(--lime-ink);
    display: grid; place-items: center; transition: transform .3s ease; }
  .tcard .tx { flex: 1; min-width: 0; }
  .tcard .tx b { font-size: 22px; font-weight: 800; }
  .tcard .tx small { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tcard .eta { font-size: 11px; color: var(--ink-2); text-align: right; }
  .runpanel { position: absolute; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    max-width: 536px; margin: 0 auto; border-radius: 26px; padding: 16px 16px 14px; }
  .timer { text-align: center; }
  .timer b { display: block; font-size: 52px; font-weight: 800; line-height: 1; }
  .timer small { font-size: 12px; }
  .trio { display: grid; grid-template-columns: repeat(3, 1fr); margin: 14px 0 12px; text-align: center; }
  .trio div + div { border-left: 1px solid var(--line); }
  .trio b { display: block; font-size: 22px; font-weight: 800; }
  .trio small { font-size: 11px; }
  .roadline { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: var(--ink-2);
    min-width: 0; margin-bottom: 14px; }
  .roadline .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .roadline span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 28px; }
  .ctl { width: 48px; height: 48px; border-radius: 50%; background: var(--card-2); display: grid; place-items: center; font-size: 18px; }
  .ctl.stop { color: var(--danger); }
  .pause { width: 68px; height: 68px; border-radius: 50%; background: #fff; color: #111; display: grid; place-items: center; }
  .pause.paused { background: var(--lime); }
  .paused-tag { position: absolute; left: 50%; transform: translateX(-50%); top: -14px; background: var(--lime); color: var(--lime-ink);
    font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 999px; letter-spacing: .06em; }

  /* ---- 완료 ---- */
  .done .hero { display: flex; align-items: baseline; gap: 6px; margin: 2px 2px 14px; }
  .done .hero b { font-size: 60px; font-weight: 800; color: var(--lime); line-height: 1; }
  .done .hero span { font-size: 18px; color: var(--ink-2); font-weight: 700; }
  .done .grid4 { grid-template-columns: repeat(2, 1fr); margin-bottom: 14px; }
  .bigbtn { width: 100%; height: 54px; border-radius: 18px; background: var(--lime); color: var(--lime-ink); font-weight: 800; font-size: 16px; }

  /* ---- 카운트다운 / 알림 ---- */
  .count { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(10,11,12,.82); }
  .count b { font-size: 140px; font-weight: 900; color: var(--lime); animation: pop .9s ease-out both; }
  @keyframes pop { from { transform: scale(1.6); opacity: 0; } 30% { opacity: 1; } to { transform: scale(1); } }
  .toast { position: fixed; z-index: 21; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 74px);
    max-width: min(520px, calc(100vw - 32px)); background: #fff; color: #111; padding: 10px 14px; border-radius: 14px;
    font-size: 13px; font-weight: 600; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  .loading { position: fixed; z-index: 21; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 18px); background: var(--card);
    color: var(--ink-2); font-size: 11px; padding: 6px 10px; border-radius: 999px; }

  /* ---- 지도 위 표시 ---- */
  /* 내 위치: 라임색 원 안의 달리는 사람 (움직일 때 2동작 반복, 멈추면 선 자세) */
  .me { position: relative; width: 56px; height: 72px; pointer-events: none; }
  .me .ground { position: absolute; left: 50%; bottom: 0; width: 44px; height: 14px; margin-left: -22px; border-radius: 50%;
    background: rgba(200,242,91,.28); animation: ring 1.6s ease-out infinite; }
  @keyframes ring { 0% { transform: scale(.6); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
  .me .badge { position: absolute; left: 50%; bottom: 12px; width: 50px; height: 50px; margin-left: -25px; border-radius: 50%;
    background: var(--lime); border: 3px solid #111; box-shadow: 0 0 0 2px var(--lime), 0 6px 18px rgba(0,0,0,.5);
    display: grid; place-items: center; }
  .me svg { width: 34px; height: 34px; overflow: visible; }
  .me svg g { fill: none; stroke: #111; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .me svg circle { fill: #111; stroke: none; }
  .me .pose-a, .me .pose-b { display: none; }
  .me.moving .stand { display: none; }
  .me.moving .pose-a { display: inline; animation: stepA .5s steps(1) infinite; }
  .me.moving .pose-b { display: inline; animation: stepB .5s steps(1) infinite; }
  @keyframes stepA { 0% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes stepB { 0% { opacity: 0; } 50% { opacity: 1; } }
  .next-mark { width: 46px; height: 46px; border-radius: 50%; pointer-events: none; border: 3px solid var(--lime);
    animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(200,242,91,.25); } }
  @media (prefers-reduced-motion: reduce) {
    .next-mark, .me .ground, .count b { animation: none; } .tcard .arrow { transition: none; }
    .me.moving .pose-a { animation: none; } .me.moving .pose-b { display: none; }
  }
  .maplibregl-popup-content { background: var(--card); color: var(--ink); border-radius: 12px; font-family: var(--font); font-size: 13px; }
  .maplibregl-popup-tip { border-top-color: var(--card) !important; border-bottom-color: var(--card) !important; }
  .maplibregl-ctrl-attrib { background: rgba(14,15,17,.6) !important; color: var(--ink-3); }
  .maplibregl-ctrl-attrib a { color: var(--ink-2) !important; }
  .maplibregl-ctrl-attrib-button { filter: invert(1); }
</style>
</head>
<body>
<div id="map" aria-label="러닝 지도"></div>

<!-- 홈: 지역 고르기 + 지역 요약 + 추천 코스 -->
<section class="screen" id="home">
  <header class="top home-top">
    <div class="date" id="today"></div>
    <h1>Start a Run</h1>
    <label class="pill">
      <i class="dot"></i><span id="regionName">어디서 달릴까요? 지역 고르기</span><b aria-hidden="true">▾</b>
      <select id="regionSel" aria-label="시군구 선택"><option value="">시군구 고르기…</option></select>
    </label>
  </header>
  <div class="sheet" id="homeSheet">
    <div class="grip"></div>
    <div class="sec"><h2>이 지역 러닝 환경</h2>
      <div class="seg" role="group" aria-label="길 색 기준">
        <button id="segSlope" aria-pressed="true">경사도</button><button id="segRun" aria-pressed="false">길 등급</button>
      </div>
    </div>
    <div class="grid4">
      <div class="tile"><i>러닝 길</i><b class="num" id="hRun">–</b></div>
      <div class="tile"><i>전용로</i><b class="num" id="hA">–</b></div>
      <div class="tile"><i>평지</i><b class="num" id="hFlat">–</b></div>
      <div class="tile"><i>화장실</i><b class="num" id="hToilet">–</b></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="sec"><h2>오늘의 코스</h2></div>
    <button class="row" id="courseRow" disabled>
      <span class="ic lime" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8 18h6.5a3.5 3.5 0 0 0 0-7h-5a3.5 3.5 0 0 1 0-7H16"/></svg>
      </span>
      <span class="t"><b id="courseName">추천 코스</b><small id="courseInfo">지도에서 지역을 누르면 추천 코스가 나와요</small></span>
      <span class="go" aria-hidden="true">›</span>
    </button>
    <button class="row" id="gpsRow">
      <span class="ic" aria-hidden="true">📍</span>
      <span class="t"><b>지금 내 위치에서 달리기</b><small>GPS로 기록하고 앞쪽 화장실을 알려줘요</small></span>
      <span class="go" aria-hidden="true">›</span>
    </button>
  </div>
</section>

<!-- 코스 보기 -->
<section class="screen" id="course" hidden>
  <header class="top">
    <button class="iconbtn glass" id="courseBack" aria-label="뒤로">‹</button>
    <div class="course-head glass"><b>평지 추천 코스</b><small id="cRegion"></small></div>
  </header>
  <div class="cards">
    <div class="r">
      <div class="cc"><div class="ico">↔</div><b class="num" id="cDist">–</b><small>코스 거리</small></div>
      <div class="cc"><div class="ico">⌁</div><b id="cFlat">–</b><small id="cTime">–</small></div>
    </div>
    <div class="r b">
      <div class="cc"><div class="ico">🚻</div><b id="cToilet">–</b><small>코스 150m 안 화장실</small></div>
      <button class="start" id="btnStart">START<small>4배속 미리 달리기</small></button>
    </div>
  </div>
</section>

<!-- 달리는 중 -->
<section class="screen" id="run" hidden>
  <header class="top">
    <div class="tcard glass">
      <div class="arrow" id="arrow" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 3l7 9h-4.5v9h-5v-9H5z" fill="currentColor"/></svg>
      </div>
      <div class="tx"><b class="num" id="nextDist">–</b><small id="nextName">다음 화장실 찾는 중</small></div>
      <div class="eta" id="nextEta"></div>
    </div>
  </header>
  <div class="runpanel glass">
    <span class="paused-tag" id="pausedTag" hidden>일시정지</span>
    <div class="timer"><b class="num" id="sTime">00:00</b><small>시간</small></div>
    <div class="trio">
      <div><b class="num" id="sDist">0.00</b><small>거리 km</small></div>
      <div><b class="num" id="sPace">–</b><small>페이스 /km</small></div>
      <div><b class="num" id="sClimb">0</b><small>오르막 m</small></div>
    </div>
    <div class="roadline"><span class="dot" id="roadChip"></span><span id="roadTxt">–</span></div>
    <div class="controls">
      <button class="ctl" id="btnMode" aria-label="길 색 바꾸기">◐</button>
      <button class="pause" id="btnPause" aria-label="일시정지">
        <svg width="24" height="24" viewBox="0 0 24 24" id="pauseIcon"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
      </button>
      <button class="ctl stop" id="btnStop" aria-label="종료">■</button>
    </div>
  </div>
</section>

<!-- 완료 -->
<section class="screen done" id="done" hidden>
  <div class="sheet">
    <div class="grip"></div>
    <small id="dWhen">러닝 완료</small>
    <div class="hero"><b class="num" id="dDist">0.00</b><span>km</span></div>
    <div class="grid4">
      <div class="tile"><i>시간</i><b class="num" id="dTime">–</b></div>
      <div class="tile"><i>평균 페이스</i><b class="num" id="dPace">–</b></div>
      <div class="tile"><i>오르막</i><b class="num" id="dClimb">–</b></div>
      <div class="tile"><i>지나간 화장실</i><b class="num" id="dToilet">–</b></div>
    </div>
    <button class="bigbtn" id="btnHome">홈으로</button>
  </div>
</section>

<div class="count" id="count" hidden><b id="countNum">3</b></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="loading" id="loading" hidden>러닝 길 불러오는 중…</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(() => {
  const DATA = "data/";
  const STYLE_URL = "https://tiles.openfreemap.org/styles/liberty";
  const DEM_TILES = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png";
  const LIME = "#c8f25b";
  const SLOPE = { 0: ["평지 <3%", "#2fbf71"], 1: ["완만 3~6%", "#9be15d"], 2: ["경사 6~10%", "#ffa94d"],
                  3: ["급경사 ≥10%", "#ff6b6b"], 8: ["다리·터널", "#868e96"], 9: ["정보 없음", "#5c636a"] };
  const RUN = { A: ["러닝 전용로", "#ff8a3d"], B: ["러닝 가능 길", "#5b8cff"] };
  const POI = { toilet: ["🚻", "#3ddc97", "화장실"], water: ["💧", "#4dabf7", "음수대"],
                store: ["🏪", "#ffa94d", "편의점"], police: ["👮", "#b197fc", "경찰"] };
  const RUN_PACE_SEC = 360;            // 예상 시간 계산용 기본 페이스 6:00/km

      map.addLayer({ id: "poi-other", type: "symbol", source: "poi", minzoom: 14, filter: ["!=", ["get", "t"], "toilet"],
        layout: { "icon-image": ["concat", "poi-", ["get", "t"]], "icon-allow-overlap": true, "icon-size": ["interpolate", ["linear"], ["zoom"], 14, .7, 17, 1] } });
      map.addLayer({ id: "poi-toilet", type: "symbol", source: "poi", minzoom: 11, filter: ["==", ["get", "t"], "toilet"],
        layout: { "icon-image": "poi-toilet", "icon-allow-overlap": true, "icon-size": ["interpolate", ["linear"], ["zoom"], 11, .55, 16, 1] } });

      let hover = null;
      map.on("mousemove", "regions-fill", (e) => {
        if (map.getZoom() >= DETAIL_ZOOM || state.screen !== "home") return;
        const id = e.features[0]?.properties.code;
        if (hover && hover !== id) map.setFeatureState({ source: "regions", id: hover }, { hover: false });
        hover = id; map.setFeatureState({ source: "regions", id }, { hover: true });
        map.getCanvas().style.cursor = "pointer";
      });
      map.on("mouseleave", "regions-fill", () => {
        if (hover) map.setFeatureState({ source: "regions", id: hover }, { hover: false });
        hover = null; map.getCanvas().style.cursor = "";
      });
      map.on("click", (e) => {
        if (state.screen !== "home") return;
        if (map.queryRenderedFeatures(e.point, { layers: ["run-inner", "poi-toilet", "poi-other"] }).length) return;
        if (map.getZoom() < DETAIL_ZOOM) {
          const f = map.queryRenderedFeatures(e.point, { layers: ["regions-fill"] })[0];
          if (f) selectRegion(f.properties.code);
        }
      });
      map.on("click", "run-inner", (e) => {
        if (state.nav) return;
        const p = e.features[0].properties;
        const g = p.g === null || p.g === undefined || p.g === "null" ? "" : ` · 경사 ${Math.abs(+p.g).toFixed(1)}%`;
        new maplibregl.Popup({ closeButton: false }).setLngLat(e.lngLat)
          .setHTML(`<b>${RUN[p.r][0]}</b>${p.n ? " · " + p.n : ""}<br>${SLOPE[p.s][0]}${g}`).addTo(map);
      });
      map.on("click", ["poi-toilet", "poi-other"], (e) => {
        const p = e.features[0].properties;
        new maplibregl.Popup({ closeButton: false, offset: 16 }).setLngLat(e.features[0].geometry.coordinates)
          .setHTML(`${POI[p.t][0]} <b>${POI[p.t][2]}</b>${p.n ? "<br>" + p.n : ""}`).addTo(map);
      });
      map.on("moveend", loadVisible);

      const meEl = document.createElement("div");
      meEl.className = "me";
      meEl.innerHTML = `
        <div class="ground"></div>
        <div class="badge"><svg viewBox="0 0 24 24" aria-label="나">
          <circle cx="14.2" cy="4.2" r="2.3"/>
          <g class="stand"><path d="M13.6 7.2 L12.6 14"/><path d="M13.3 8.8 L10.4 12.4"/><path d="M13.3 8.8 L16.2 12.2"/>
            <path d="M12.6 14 L11 20.5"/><path d="M12.6 14 L14.6 20.5"/></g>
          <g class="pose-a"><path d="M13.6 7.2 L11.6 13.6"/><path d="M13 8.8 L16.4 10.4 L18.2 8.4"/><path d="M13 8.8 L9.8 9.6 L8.2 12.4"/>
            <path d="M11.6 13.6 L15 16 L13.8 20.6"/><path d="M11.6 13.6 L8.6 16.8 L5.2 17.4"/></g>
          <g class="pose-b"><path d="M13.8 7.2 L11.8 13.6"/><path d="M13.2 8.8 L14.8 11.6 L17.2 10.8"/><path d="M13.2 8.8 L10.6 10.8 L9.6 8.6"/>
            <path d="M11.8 13.6 L12.8 17.2 L11.6 20.8"/><path d="M11.8 13.6 L9.6 16.6 L7.2 15.2"/></g>
        </svg></div>`;
      state.meEl = meEl;
      // opacityWhenCovered: 지형(언덕) 뒤로 판정돼도 흐려지지 않게 → 내 모습이 항상 선명하게
      state.me = new maplibregl.Marker({ element: meEl, anchor: "bottom", rotationAlignment: "viewport",
        pitchAlignment: "viewport", opacity: "1", opacityWhenCovered: "1" });
      const nm = document.createElement("div"); nm.className = "next-mark";
      state.nextMark = new maplibregl.Marker({ element: nm, opacityWhenCovered: "1" });
      const kt = document.createElement("div"); kt.className = "kmtag";
      state.kmTag = new maplibregl.Marker({ element: kt, anchor: "bottom", offset: [0, -8], opacityWhenCovered: "1" });
      const ps = document.createElement("div"); ps.className = "pin";
      state.startPin = new maplibregl.Marker({ element: ps, opacityWhenCovered: "1" });
      const pe = document.createElement("div"); pe.className = "pin end";
      state.endPin = new maplibregl.Marker({ element: pe, opacityWhenCovered: "1" });

      const q = new URLSearchParams(location.search).get("r");
      let last = null; try { last = localStorage.getItem("runnavi-region"); } catch (e) {}
      if (state.byCode[q]) selectRegion(q);
      else if (state.byCode[last]) selectRegion(last);
    });

    // ---------- 버튼 ----------
    $("segSlope").onclick = () => setMode("slope");
    $("segRun").onclick = () => setMode("run");
    $("btnMode").onclick = () => { setMode(state.mode === "slope" ? "run" : "slope"); toast(state.mode === "slope" ? "길 색: 경사도" : "길 색: 러닝 전용로 / 가능 길", 1800); };
    $("courseRow").onclick = openCourse;
    $("courseBack").onclick = closeCourse;
    $("btnStart").onclick = startDemo;
    $("gpsRow").onclick = startGps;
    $("btnPause").onclick = () => setPaused(!state.paused);
    $("btnStop").onclick = () => {
      if (!state.paused) { setPaused(true); return toast("일시정지했어요. ■를 한 번 더 누르면 러닝이 끝나요"); }
      finish();
    };
    $("btnHome").onclick = goHome;
    window.addEventListener("resize", () => state.map && state.map.setPadding(padFor(state.screen)));
  }).catch((e) => {
    console.error(e);
    toast("전국 지역 목록(data/regions.geojson)을 불러오지 못했어요.", 10000);
  });

  // ---------- 코스 화면 ----------
  function drawCourse(route) {
    state.map.getSource("course").setData({ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: route } });
    state.startPin.setLngLat(route[0]).addTo(state.map);
    state.endPin.setLngLat(route[route.length - 1]).addTo(state.map);
  }
  function clearCourse() {
    state.map.getSource("course").setData({ type: "FeatureCollection", features: [] });
    state.startPin.remove(); state.endPin.remove(); state.kmTag.remove();
  }
  async function openCourse() {
    const reg = state.cur && await loadRegion(state.cur).catch(() => null);
    if (!reg || !reg.route) return toast("이 지역은 추천 코스가 없어요");
    const p = state.byCode[state.cur], km = reg.demo_m / 1000;
    $("cRegion").textContent = p.label;
    $("cDist").textContent = `${km.toFixed(1)} km`;
    $("cFlat").textContent = p.flat_pct != null ? `평지 ${p.flat_pct.toFixed(0)}% 지역` : "전용로·평지 위주";
    $("cTime").textContent = `6'00" 페이스로 약 ${Math.round(km * RUN_PACE_SEC / 60)}분`;
    $("cToilet").textContent = `${toiletsNear(reg.route, 150)}곳`;
    show("course");
    drawCourse(reg.route);
    state.map.setPaintProperty("course-line", "line-opacity", 1);
    state.map.setPaintProperty("course-glow", "line-opacity", .35);
    state.kmTag.getElement().textContent = `${km.toFixed(1)} km`;
    state.kmTag.setLngLat(reg.route[Math.floor(reg.route.length / 2)]).addTo(state.map);
    const b = reg.route.reduce((bb, c) => bb.extend(c), new maplibregl.LngLatBounds(reg.route[0], reg.route[0]));
    state.map.fitBounds(b, { pitch: 30, bearing: 0, duration: 1200, maxZoom: 16 });
  }
  function closeCourse() { clearCourse(); show("home"); state.map.easeTo({ pitch: 45, duration: 800 }); }

  // ---------- 달리기 공통 ----------
  function countdown() {
    return new Promise((res) => {
      const el = $("count"), num = $("countNum"); el.hidden = false;
      let n = 3;
      const tick = () => {
        if (n === 0) { num.textContent = "GO"; num.style.animation = "none"; void num.offsetWidth; num.style.animation = "";
          return setTimeout(() => { el.hidden = true; res(); }, 600); }
        num.textContent = n; num.style.animation = "none"; void num.offsetWidth; num.style.animation = "";
        n--; setTimeout(tick, 900);
      };
      tick();
    });
  }
  function beginRun(kind) {
    state.nav = kind; state.dist = 0; state.climb = 0; state.lastAlt = null; state.trace = []; state.paused = false;
    state.clock = { acc: 0, since: performance.now() };
    state.lastPos = null; state.lastUpdAt = null; state.lastMoveAt = 0; state.lastRegionCheck = 0; state.lastTraceDraw = 0;
    state.map.getSource("trace").setData({ type: "FeatureCollection", features: [] });
    state.kmTag.remove();
    if (state.map.getSource("course")._data?.geometry) {           // 코스는 흐리게 남겨 두고, 달린 길을 밝은 라임으로
      state.map.setPaintProperty("course-line", "line-opacity", .3);
      state.map.setPaintProperty("course-glow", "line-opacity", 0);
    }
    $("pausedTag").hidden = true; $("btnPause").classList.remove("paused"); setPauseIcon(false);
    show("run");
    clearInterval(state.clockTimer);
    state.clockTimer = setInterval(() => { $("sTime").textContent = fmtTime(clockSec()); }, 250);
  }
  function setPauseIcon(paused) {
    $("pauseIcon").innerHTML = paused ? `<path d="M8 5l11 7-11 7z" fill="currentColor"/>`
      : `<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/>`;
    $("btnPause").setAttribute("aria-label", paused ? "다시 달리기" : "일시정지");
  }
  function setPaused(p) {
    if (!state.nav || p === state.paused) return;
    state.paused = p;
    const now = performance.now();
    if (p) { state.clock.acc += now - state.clock.since; state.clock.since = null; }
    else { state.clock.since = now; state.lastPos = null; }
    $("pausedTag").hidden = !p; $("btnPause").classList.toggle("paused", p); setPauseIcon(p);
    state.meEl.classList.toggle("moving", false);
  }
  function stopTracking() {
    if (state.watchId != null) navigator.geolocation.clearWatch(state.watchId);
    state.watchId = null; cancelAnimationFrame(state.raf); clearInterval(state.clockTimer);
    state.nextMark.remove(); state.nextShown = false;
    state.me.remove(); state.meShown = false;
  }
  function finish() {
    const sec = clockSec(), kind = state.nav;
    stopTracking(); state.nav = null;
    if (state.trace.length < 2 || state.dist < 20) { toast("기록이 너무 짧아 저장하지 않았어요"); return goHome(); }
    $("dDist").textContent = (state.dist / 1000).toFixed(2);
    $("dTime").textContent = fmtTime(sec);
    $("dPace").textContent = fmtPace(sec / (state.dist / 1000));
    $("dClimb").innerHTML = `${Math.round(state.climb)}<em>m</em>`;
    $("dToilet").innerHTML = `${toiletsNear(state.trace, 80)}<em>곳</em>`;
    $("dWhen").textContent = `${kind === "demo" ? "데모 러닝" : "러닝"} 완료 · ${state.cur ? state.byCode[state.cur].label : ""}`;
    state.map.getSource("trace").setData({ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: state.trace } });
    clearCourse();
    show("done");
    const b = state.trace.reduce((bb, c) => bb.extend(c), new maplibregl.LngLatBounds(state.trace[0], state.trace[0]));
    state.map.fitBounds(b, { pitch: 0, bearing: 0, duration: 1000, maxZoom: 16 });
  }
  function goHome() {
    stopTracking(); state.nav = null;
    state.map.getSource("trace").setData({ type: "FeatureCollection", features: [] });
    clearCourse(); show("home"); renderHome();
    state.map.easeTo({ pitch: 45, bearing: 0, zoom: Math.min(state.map.getZoom(), 14.5), duration: 900 });
  }

  function update(pos, heading, now, refreshOnly) {
    const map = state.map;
    if (!refreshOnly) {
      const moved = state.lastPos ? haversine(state.lastPos, pos) : 0;
      const dt = Math.max((now - (state.lastUpdAt || now)) / 1000, 0.001);
      state.lastUpdAt = now;
      if (!state.paused) {
        if (moved < 50) state.dist += moved;
        if (moved / dt > 0.8) state.lastMoveAt = now;                 // 초속 0.8m 넘게 움직일 때만 '달리는 중'
        const lastT = state.trace[state.trace.length - 1];
        if (!lastT || haversine(lastT, pos) > 3) state.trace.push(pos);
        if (now - (state.lastTraceDraw || 0) > 400 && state.trace.length > 1) {
          state.lastTraceDraw = now;
          map.getSource("trace").setData({ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: [...state.trace, pos] } });
        }
        state.lastPos = pos;
      }
      state.pos = pos; state.heading = heading;
      state.camBearing = (state.camBearing + angDiff(state.camBearing, heading) * 0.12 + 360) % 360;
      state.me.setLngLat(pos);
      state.meEl.classList.toggle("moving", !state.paused && now - (state.lastMoveAt || 0) < 2500);
      if (!state.meShown) { state.me.addTo(map); state.meShown = true; }      // 위치를 넣은 뒤에 지도에 올림
      map.jumpTo({ center: pos, bearing: state.camBearing, pitch: 55, zoom: 17 });

      if (now - (state.lastRegionCheck || 0) > 2000) {                 // 2초마다 지금 시군구 확인 → 이웃 지역 불러오기
        state.lastRegionCheck = now;
        const code = regionAt(pos);
        if (code && code !== state.cur) setCurrent(code);
      }
      if (now - (state.lastUi || 0) < 200) return;
    }
    state.lastUi = now;

    const alt = map.queryTerrainElevation ? map.queryTerrainElevation(pos) : null;
    if (alt != null && isFinite(alt) && !state.paused) {
      if (state.lastAlt != null && alt > state.lastAlt + 0.3) state.climb += alt - state.lastAlt;
      if (state.lastAlt == null || Math.abs(alt - state.lastAlt) > 0.3) state.lastAlt = alt;
    }

    // 진행 방향 다음 화장실 (앞쪽 ±70° 안에서 가장 가까운 곳, 없으면 가장 가까운 곳)
    let best = null, fallback = null;
    for (const t of state.toilets) {
      if (Math.abs(t.ll[1] - pos[1]) > .05 || Math.abs(t.ll[0] - pos[0]) > .06) continue;
      const d = haversine(pos, t.ll), rel = angDiff(state.heading, bearing(pos, t.ll));
      if (!fallback || d < fallback.d) fallback = { ...t, d, rel };
      if (Math.abs(rel) <= 70 && d <= 5000 && (!best || d < best.d)) best = { ...t, d, rel };
    }
    const target = best || fallback;
    if (target) {
      state.nextMark.setLngLat(target.ll);
      if (!state.nextShown) { state.nextMark.addTo(map); state.nextShown = true; }
      $("nextDist").textContent = fmtDist(target.d);
      $("nextName").textContent = `🚻 ${best ? "앞쪽" : "뒤쪽"} 화장실 · ${target.name || "공중화장실"}`;
      $("nextEta").innerHTML = `약 ${Math.max(1, Math.round(target.d / 1000 * RUN_PACE_SEC / 60))}분<br>직선거리`;
      $("arrow").style.transform = `rotate(${target.rel}deg)`;
    } else {
      if (state.nextShown) { state.nextMark.remove(); state.nextShown = false; }
      $("nextDist").textContent = "–"; $("nextName").textContent = "5km 안에 화장실 정보 없음"; $("nextEta").textContent = "";
      $("arrow").style.transform = "";
    }

    const p = map.project(pos);
    const fs = map.queryRenderedFeatures([[p.x - 14, p.y - 14], [p.x + 14, p.y + 14]], { layers: ["run-inner"] });
    if (fs.length) {
      const f = fs[0].properties;
      $("roadChip").style.background = state.mode === "slope" ? SLOPE[f.s][1] : RUN[f.r][1];
      const g = f.g === null || f.g === undefined || f.g === "null" ? "" : ` ${Math.abs(+f.g).toFixed(1)}%`;
      const sl = f.s === 9 ? "경사 정보 없음" : f.s === 8 ? "다리·터널" : SLOPE[f.s][0].split(" ")[0];
      $("roadTxt").textContent = `${RUN[f.r][0]} · ${sl}${g}${f.n ? " · " + f.n : ""}`;
    } else {
      $("roadChip").style.background = "";
      $("roadTxt").textContent = state.loading.size ? "이 지역 러닝 길을 받는 중이에요" : "러닝 길 정보가 없는 곳이에요";
    }
    $("sDist").textContent = (state.dist / 1000).toFixed(2);
    $("sPace").textContent = state.dist > 30 ? fmtPace(clockSec() / (state.dist / 1000)) : "–";
    $("sClimb").textContent = Math.round(state.climb);
  }

  // ---------- 데모 (추천 코스를 4배속으로) ----------
  async function startDemo() {
    const reg = state.cur && await loadRegion(state.cur).catch(() => null);
    if (!reg || !reg.route) return toast("이 지역은 추천 코스가 없어요");
    const route = reg.route, cum = [0];
    for (let i = 1; i < route.length; i++) cum.push(cum[i - 1] + haversine(route[i - 1], route[i]));
    const total = cum[cum.length - 1];
    const at = (s) => {
      s = Math.min(Math.max(s, 0), total);
      let i = 1; while (i < cum.length - 1 && cum[i] < s) i++;
      const t = (s - cum[i - 1]) / Math.max(cum[i] - cum[i - 1], 1e-6);
      return [route[i - 1][0] + (route[i][0] - route[i - 1][0]) * t, route[i - 1][1] + (route[i][1] - route[i - 1][1]) * t];
    };
    ensureAround(state.cur);
    state.camBearing = bearing(at(0), at(25));
    state.map.jumpTo({ center: at(0), bearing: state.camBearing, pitch: 55, zoom: 17 });
    await countdown();
    drawCourse(route);
    beginRun("demo");
    let s = 0, last = performance.now();
    const step = (now) => {
      if (state.nav !== "demo") return;
      if (!state.paused) s += DEMO_SPEED * (now - last) / 1000;
      last = now;
      if (s >= total) { update(at(total), state.heading, now); toast(`코스 완주! ${(total / 1000).toFixed(1)}km`); return finish(); }
      if (!state.paused || !state.meShown) { const pos = at(s); update(pos, bearing(pos, at(s + 25)), now); }
      state.raf = requestAnimationFrame(step);
    };
    state.raf = requestAnimationFrame(step);
  }

  // ---------- 실제 GPS ----------
  function startGps() {
    if (!("geolocation" in navigator)) return toast("이 기기에서는 위치를 쓸 수 없어요");
    if (!state.regions) return;
    let phase = "find", prev = null, heading = 0;
    toast("내 위치를 찾는 중…", 3000);
    state.watchId = navigator.geolocation.watchPosition(async (p) => {
      const pos = [p.coords.longitude, p.coords.latitude];
      if (p.coords.heading != null && !isNaN(p.coords.heading) && (p.coords.speed || 0) > 0.6) heading = p.coords.heading;
      else if (prev && haversine(prev, pos) > 4) heading = bearing(prev, pos);
      if (!prev || haversine(prev, pos) > 4) prev = pos;
      if (phase === "find") {
        const code = regionAt(pos);
        if (!code) {
          toast("지금 위치는 러닝 지도(국내 시군구) 밖이에요. 추천 코스로 미리 달려 보세요.", 6000);
          navigator.geolocation.clearWatch(state.watchId); state.watchId = null; return;
        }
        phase = "count"; setCurrent(code, true);
        state.map.jumpTo({ center: pos, pitch: 55, zoom: 17 });
        await countdown();
        clearCourse(); beginRun("gps"); phase = "run";
      }
      if (phase === "run" && state.nav === "gps") update(pos, heading, performance.now());
    }, (err) => {
      if (phase === "run" && err.code !== 1) return toast("GPS 신호가 약해요. 계속 찾는 중…", 2500);
      toast(err.code === 1 ? "위치 권한을 허용해 주세요 (브라우저 설정)" : "위치를 찾지 못했어요");
      if (state.watchId != null) navigator.geolocation.clearWatch(state.watchId);
      state.watchId = null;
      if (state.nav === "gps") goHome();
    }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
  }

  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
