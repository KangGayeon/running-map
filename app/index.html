<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>러닝 내비</title>
<meta name="theme-color" content="#14202a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="러닝 내비">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  /* 레이아웃: 지도 전체화면 + 위(안내 배너) / 아래(현재 길 정보·버튼) 오버레이 */
  :root {
    --panel: #ffffff; --panel-2: #f2f5f7; --ink: #14202a; --ink-2: #5b6b78;
    --accent: #e8590c; --accent-ink: #ffffff; --nav: #14202a; --nav-ink: #ffffff; --line: #d8dee3;
    --shadow: 0 6px 24px rgba(10, 20, 30, .18);
    --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --panel: #1b2731; --panel-2: #24323d; --ink: #eef3f6; --ink-2: #9fb0bd; --line: #33434f;
      --shadow: 0 6px 24px rgba(0, 0, 0, .45); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --panel: #1b2731; --panel-2: #24323d; --ink: #eef3f6; --ink-2: #9fb0bd; --line: #33434f;
    --shadow: 0 6px 24px rgba(0, 0, 0, .45); color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--nav); color: var(--ink); font-family: var(--font); }
  body { overflow: hidden; -webkit-tap-highlight-color: transparent; }
  #map { position: fixed; inset: 0; }
  [hidden] { display: none !important; }

  /* 위쪽 안내 배너 (내비의 "다음 회전" 자리) */
  .banner {
    position: fixed; z-index: 5; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
    pointer-events: none;
  }
  .card {
    pointer-events: auto; max-width: 560px; margin: 0 auto; border-radius: 16px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .next { display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: var(--nav); color: var(--nav-ink); }
  .next .arrow { width: 48px; height: 48px; flex: none; display: grid; place-items: center;
    border-radius: 12px; background: rgba(255,255,255,.12); transition: transform .3s ease; }
  .next .big { font-size: 30px; font-weight: 800; letter-spacing: -.5px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .next .small { font-size: 14px; opacity: .8; margin-top: 2px; }
  .next .what { margin-left: auto; text-align: right; font-size: 13px; opacity: .85; }
  .intro { background: var(--panel); padding: 14px 16px; }
  .intro h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -.3px; text-wrap: balance; }
  .intro p { margin: 0; color: var(--ink-2); font-size: 13px; line-height: 1.5; }

  /* 아래쪽 정보·버튼 */
  .bottom {
    position: fixed; z-index: 5; left: 0; right: 0; bottom: 0;
    padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(12px, env(safe-area-inset-left, 0px));
    pointer-events: none;
  }
  .sheet { pointer-events: auto; max-width: 560px; margin: 0 auto; background: var(--panel); border-radius: 18px;
    box-shadow: var(--shadow); padding: 12px; display: grid; gap: 10px; }
  .road { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .road .chip { flex: none; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; color: #fff; }
  .road .txt { min-width: 0; font-size: 14px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--panel-2); border-radius: 12px; padding: 8px 10px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
  .stat span { font-size: 11px; color: var(--ink-2); letter-spacing: .02em; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--ink-2); }
  .legend i { display: inline-block; width: 18px; height: 6px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
  .btns { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 8px; }
  button {
    font: inherit; font-size: 14px; font-weight: 700; border: 0; border-radius: 12px; padding: 12px 8px;
    background: var(--panel-2); color: var(--ink); cursor: pointer; min-width: 0; white-space: nowrap;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); }
  button.stop { background: #c92a2a; color: #fff; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .toast { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 230px); max-width: min(520px, calc(100vw - 32px));
    background: var(--nav); color: var(--nav-ink); padding: 10px 14px; border-radius: 12px; font-size: 13px; box-shadow: var(--shadow); }

  /* 지도 위 표시 */
  /* 내 위치: 달리는 사람 (움직일 때 팔다리 2동작 반복, 멈추면 선 자세) */
  .me { position: relative; width: 52px; height: 74px; pointer-events: none; }
  .me .ground { position: absolute; left: 50%; bottom: 0; width: 40px; height: 14px; margin-left: -20px;
    border-radius: 50%; background: rgba(28,126,214,.25); }
  .me .badge { position: absolute; left: 50%; bottom: 14px; width: 48px; height: 48px; margin-left: -24px;
    border-radius: 50%; background: #1c7ed6; border: 3px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,.35);
    display: grid; place-items: center; }
  .me .badge::after { content: ""; position: absolute; left: 50%; bottom: -9px; margin-left: -6px;
    border: 6px solid transparent; border-top: 8px solid #fff; border-bottom: 0; }
  .me svg { width: 34px; height: 34px; overflow: visible; }
  .me svg g { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .me svg circle { fill: #fff; stroke: none; }
  .me .pose-a, .me .pose-b { display: none; }
  .me.moving .stand { display: none; }
  .me.moving .pose-a { display: inline; animation: stepA .5s steps(1) infinite; }
  .me.moving .pose-b { display: inline; animation: stepB .5s steps(1) infinite; }
  @keyframes stepA { 0% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes stepB { 0% { opacity: 0; } 50% { opacity: 1; } }
  .poi { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 16px;
    background: #fff; border: 3px solid var(--c, #888); box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .poi.toilet { width: 38px; height: 38px; font-size: 20px; }
  .poi.next { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(32, 160, 90, .25); } }
  @media (prefers-reduced-motion: reduce) {
    .poi.next { animation: none; } .next .arrow { transition: none; }
    .me.moving .pose-a { animation: none; } .me.moving .pose-b { display: none; }
  }
  .maplibregl-ctrl-bottom-right { bottom: calc(env(safe-area-inset-bottom, 0px) + 250px); }
  @media (max-width: 420px) { .next .big { font-size: 26px; } .btns { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div id="map" aria-label="러닝 지도"></div>

<div class="banner">
  <div class="card" id="introCard">
    <div class="intro">
      <h1 id="title">러닝 내비</h1>
      <p id="sub">러닝 전용로·경사도·화장실을 내비게이션처럼 보여줘요. 아래 <b>데모 주행</b>으로 미리 달려보세요.</p>
    </div>
  </div>
  <div class="card" id="navCard" hidden>
    <div class="next">
      <div class="arrow" id="arrow" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 3l7 9h-4.5v9h-5v-9H5z" fill="currentColor"/></svg>
      </div>
      <div>
        <div class="big" id="nextDist">–</div>
        <div class="small" id="nextName">다음 화장실 찾는 중</div>
      </div>
      <div class="what" id="nextEta"></div>
    </div>
  </div>
</div>

<div class="bottom">
  <div class="sheet">
    <div class="road" id="roadRow" hidden>
      <span class="chip" id="roadChip">–</span>
      <span class="txt" id="roadTxt"></span>
    </div>
    <div class="stats" id="stats" hidden>
      <div class="stat"><b id="sDist">0.00</b><span>달린 거리 km</span></div>
      <div class="stat"><b id="sPace">–</b><span>페이스 /km</span></div>
      <div class="stat"><b id="sClimb">0</b><span>누적 오르막 m</span></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="btns">
      <button class="primary" id="btnDemo">▶ 데모 주행</button>
      <button id="btnGps">📍 내 위치</button>
      <button id="btnMode">색: 경사도</button>
      <button id="btn3d">2D 보기</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(() => {
  const REGION = new URLSearchParams(location.search).get("r") || "ulsan_junggu_namgu";
  const BASE = `data/${REGION}/`;
  const STYLE_URL = "https://tiles.openfreemap.org/styles/liberty";
  const DEM_TILES = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png";
  const SLOPE = { 0: ["평지 <3%", "#1a9850"], 1: ["완만 3~6%", "#91cf60"], 2: ["경사 6~10%", "#fdae61"],
                  3: ["급경사 ≥10%", "#d73027"], 8: ["다리·터널", "#8a8f98"], 9: ["정보 없음", "#b0b7bf"] };
  const RUN = { A: ["러닝 전용로", "#e8590c"], B: ["러닝 가능 길", "#3b6fd6"] };
  const POI = { toilet: ["🚻", "#20a05a", "화장실"], water: ["💧", "#1c7ed6", "음수대"],
                store: ["🏪", "#f08c00", "편의점"], police: ["👮", "#7048e8", "경찰"] };
  const RUN_PACE_SEC = 360;            // 남은 시간 계산용 기본 페이스 6:00/km
  const DEMO_SPEED = 3.0 * 4;          // 데모: 3 m/s(5:33/km)를 4배속으로

  const $ = (id) => document.getElementById(id);
  const state = { mode: "slope", is3d: true, nav: null, pos: null, heading: 0, camBearing: 0,
                  dist: 0, climb: 0, lastAlt: null, startTime: 0, toilets: [], markers: [] };

  // ---------- 계산 도우미 ----------
  const R = 6371000, rad = (d) => d * Math.PI / 180, deg = (r) => r * 180 / Math.PI;
  function haversine(a, b) {
    const dLat = rad(b[1] - a[1]), dLon = rad(b[0] - a[0]);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[1])) * Math.cos(rad(b[1])) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function bearing(a, b) {
    const y = Math.sin(rad(b[0] - a[0])) * Math.cos(rad(b[1]));
    const x = Math.cos(rad(a[1])) * Math.sin(rad(b[1])) - Math.sin(rad(a[1])) * Math.cos(rad(b[1])) * Math.cos(rad(b[0] - a[0]));
    return (deg(Math.atan2(y, x)) + 360) % 360;
  }
  const angDiff = (a, b) => ((b - a + 540) % 360) - 180;
  const fmtDist = (m) => m >= 1000 ? `${(m / 1000).toFixed(1)}km` : `${Math.round(m / 10) * 10}m`;
  const fmtPace = (sec) => !isFinite(sec) || sec <= 0 ? "–" : `${Math.floor(sec / 60)}'${String(Math.round(sec % 60)).padStart(2, "0")}"`;
  function toast(msg, ms = 4000) {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), ms);
  }

  // ---------- 지도 스타일 ----------
  const colorExpr = () => state.mode === "slope"
    ? ["match", ["get", "s"], 0, SLOPE[0][1], 1, SLOPE[1][1], 2, SLOPE[2][1], 3, SLOPE[3][1], 8, SLOPE[8][1], SLOPE[9][1]]
    : ["match", ["get", "r"], "A", RUN.A[1], RUN.B[1]];
  // 러닝 전용로(A)는 큰길처럼 두껍게, 러닝 가능 길(B)은 골목처럼 가늘게
  const widthExpr = (extra) => ["interpolate", ["exponential", 1.6], ["zoom"],
    12, ["match", ["get", "r"], "A", 2 + extra * .4, 1 + extra * .3],
    15, ["match", ["get", "r"], "A", 5 + extra, 2.5 + extra * .7],
    17, ["match", ["get", "r"], "A", 12 + extra * 1.5, 6 + extra],
    19, ["match", ["get", "r"], "A", 28 + extra * 2, 14 + extra * 1.5]];

  function renderLegend() {
    const items = state.mode === "slope" ? [0, 1, 2, 3, 8].map((k) => SLOPE[k]) : [RUN.A, RUN.B];
    $("legend").innerHTML = items.map(([n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join("") +
      `<span>🚻 화장실 · 💧 음수대 · 🏪 편의점 · 👮 경찰</span>`;
    $("btnMode").textContent = state.mode === "slope" ? "색: 경사도" : "색: 길 등급";
  }

  async function fetchStyle() {
    try {
      const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 7000);
      const r = await fetch(STYLE_URL, { signal: ctrl.signal });
      if (!r.ok) throw new Error(r.status);
      return await r.json();
    } catch (e) {
      toast("배경지도를 불러오지 못해 러닝 길만 보여줘요");
      return { version: 8, sources: {}, layers: [{ id: "bg", type: "background", paint: { "background-color": "#e9eef1" } }] };
    }
  }

  // ---------- 시작 ----------
  Promise.all([
    fetch(BASE + "meta.json").then((r) => r.json()),
    fetch(BASE + "lines.geojson").then((r) => r.json()),
    fetch(BASE + "pois.geojson").then((r) => r.json()),
    fetch(BASE + "demo_route.json").then((r) => r.json()),
    fetchStyle(),
  ]).then(([meta, lines, pois, route, style]) => {
    $("title").textContent = `${meta.label} 러닝 내비`;
    document.title = `${meta.label} 러닝 내비`;
    state.meta = meta; state.route = route;
    if (!meta.has_slope) state.mode = "run";
    renderLegend();

    const map = new maplibregl.Map({
      container: "map", style, center: meta.center, zoom: 15.2, pitch: 60, bearing: -25,
      maxPitch: 75, attributionControl: { compact: true },
    });
    state.map = map;
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");

    map.on("load", () => {
      const firstSymbol = (map.getStyle().layers.find((l) => l.type === "symbol") || {}).id;
      try {
        map.addSource("dem", { type: "raster-dem", tiles: [DEM_TILES], encoding: "terrarium", tileSize: 256, maxzoom: 14 });
        map.setTerrain({ source: "dem", exaggeration: 1.4 });
      } catch (e) { /* 지형이 없어도 지도는 동작 */ }

      map.addSource("run", { type: "geojson", data: lines });
      map.addSource("demo", { type: "geojson", data: { type: "Feature", geometry: { type: "LineString", coordinates: route } } });
      map.addLayer({ id: "demo-glow", type: "line", source: "demo", layout: { "line-cap": "round", "line-join": "round", visibility: "none" },
        paint: { "line-color": "#ffd43b", "line-width": ["interpolate", ["linear"], ["zoom"], 12, 8, 17, 30, 19, 60], "line-blur": 6, "line-opacity": .75 } }, firstSymbol);
      map.addLayer({ id: "run-casing", type: "line", source: "run", layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": "#1d2a33", "line-width": widthExpr(3), "line-opacity": .85 } }, firstSymbol);
      map.addLayer({ id: "run-inner", type: "line", source: "run", layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": colorExpr(), "line-width": widthExpr(0) } }, firstSymbol);
      // 길 가운데 흰 점선 (도로 중앙선 느낌, 전용로만)
      map.addLayer({ id: "run-center", type: "line", source: "run", minzoom: 16, filter: ["==", ["get", "r"], "A"],
        layout: { "line-cap": "butt", "line-join": "round" },
        paint: { "line-color": "rgba(255,255,255,.85)", "line-width": ["interpolate", ["linear"], ["zoom"], 16, 1, 19, 3], "line-dasharray": [3, 3] } }, firstSymbol);

      map.on("click", "run-inner", (e) => {
        const p = e.features[0].properties;
        const g = p.g === null || p.g === undefined || p.g === "null" ? "" : ` · 경사 ${Math.abs(+p.g).toFixed(1)}%`;
        new maplibregl.Popup({ closeButton: false }).setLngLat(e.lngLat)
          .setHTML(`<b>${RUN[p.r][0]}</b>${p.n ? " · " + p.n : ""}<br>${SLOPE[p.s][0]}${g}`).addTo(map);
      });

      for (const f of pois.features) {
        const [emoji, c] = POI[f.properties.t] || ["•", "#888"];
        const el = document.createElement("div");
        el.className = `poi ${f.properties.t}`; el.style.setProperty("--c", c); el.textContent = emoji;
        el.title = `${POI[f.properties.t]?.[2] || ""} ${f.properties.n || ""}`;
        const m = new maplibregl.Marker({ element: el }).setLngLat(f.geometry.coordinates).addTo(map);
        if (f.properties.t === "toilet") state.toilets.push({ ll: f.geometry.coordinates, name: f.properties.n, el });
      }

      const meEl = document.createElement("div");
      meEl.className = "me";
      meEl.innerHTML = `
        <div class="ground"></div>
        <div class="badge"><svg viewBox="0 0 24 24" aria-label="나">
          <circle cx="14.2" cy="4.2" r="2.3"/>
          <g class="stand"><path d="M13.6 7.2 L12.6 14"/><path d="M13.3 8.8 L10.4 12.4"/><path d="M13.3 8.8 L16.2 12.2"/>
            <path d="M12.6 14 L11 20.5"/><path d="M12.6 14 L14.6 20.5"/></g>
          <g class="pose-a"><path d="M13.6 7.2 L11.6 13.6"/><path d="M13 8.8 L16.4 10.4 L18.2 8.4"/><path d="M13 8.8 L9.8 9.6 L8.2 12.4"/>
            <path d="M11.6 13.6 L15 16 L13.8 20.6"/><path d="M11.6 13.6 L8.6 16.8 L5.2 17.4"/></g>
          <g class="pose-b"><path d="M13.8 7.2 L11.8 13.6"/><path d="M13.2 8.8 L14.8 11.6 L17.2 10.8"/><path d="M13.2 8.8 L10.6 10.8 L9.6 8.6"/>
            <path d="M11.8 13.6 L12.8 17.2 L11.6 20.8"/><path d="M11.8 13.6 L9.6 16.6 L7.2 15.2"/></g>
        </svg></div>`;
      state.meEl = meEl;
      // 사람은 항상 똑바로 서 있게(viewport). 지도가 진행 방향으로 돌아가므로 앞쪽 = 화면 위쪽
      state.me = new maplibregl.Marker({ element: meEl, anchor: "bottom", rotationAlignment: "viewport", pitchAlignment: "viewport" });
    });

    // ---------- 버튼 ----------
    $("btnMode").onclick = () => {
      if (!state.meta.has_slope) return toast("이 지역은 경사도 데이터가 없어요");
      state.mode = state.mode === "slope" ? "run" : "slope";
      map.setPaintProperty("run-inner", "line-color", colorExpr());
      renderLegend();
    };
    $("btn3d").onclick = () => {
      state.is3d = !state.is3d;
      $("btn3d").textContent = state.is3d ? "2D 보기" : "3D 보기";
      if (!state.nav) map.easeTo({ pitch: state.is3d ? 60 : 0, duration: 600 });
    };
    $("btnDemo").onclick = () => (state.nav === "demo" ? stopNav() : startDemo());
    $("btnGps").onclick = () => (state.nav === "gps" ? stopNav() : startGps());
  }).catch((e) => {
    console.error(e);
    toast("데이터를 불러오지 못했어요. 주소의 지역 이름(r=…)을 확인해 주세요.", 10000);
  });

  // ---------- 내비 공통 ----------
  function beginNav(kind) {
    state.nav = kind; state.dist = 0; state.climb = 0; state.lastAlt = null; state.startTime = performance.now();
    state.lastPos = null; state.lastUpdAt = null; state.lastMoveAt = 0;
    $("introCard").hidden = true; $("navCard").hidden = false; $("roadRow").hidden = false; $("stats").hidden = false;
    $("btnDemo").textContent = kind === "demo" ? "■ 멈추기" : "▶ 데모 주행";
    $("btnDemo").className = kind === "demo" ? "stop" : "primary";
    $("btnGps").textContent = kind === "gps" ? "■ 멈추기" : "📍 내 위치";
    $("btnGps").className = kind === "gps" ? "stop" : "";
    $("legend").hidden = true;                                   // 주행 중엔 지도를 넓게
    requestAnimationFrame(() => {                                // 내 위치를 정보창 바로 위쪽에
      const h = state.map.getContainer().clientHeight;
      const sheetH = document.querySelector(".sheet").getBoundingClientRect().height + 24;
      state.map.setPadding({ top: Math.round(h * 0.38), bottom: Math.round(sheetH), left: 0, right: 0 });
    });
  }
  function stopNav() {
    if (state.watchId != null) navigator.geolocation.clearWatch(state.watchId);
    state.watchId = null; cancelAnimationFrame(state.raf); state.nav = null;
    state.map.setLayoutProperty("demo-glow", "visibility", "none");
    state.map.setPadding({ top: 0, bottom: 0, left: 0, right: 0 });
    state.map.easeTo({ pitch: state.is3d ? 60 : 0, zoom: 15.5, duration: 800 });
    $("navCard").hidden = true; $("introCard").hidden = false; $("legend").hidden = false;
    $("roadRow").hidden = true; $("stats").hidden = true;
    $("btnDemo").textContent = "▶ 데모 주행"; $("btnDemo").className = "primary";
    $("btnGps").textContent = "📍 내 위치"; $("btnGps").className = "";
    state.toilets.forEach((t) => t.el.classList.remove("next"));
    state.me.remove(); state.meShown = false;
  }

  function update(pos, heading, now) {
    const map = state.map;
    const moved = state.lastPos ? haversine(state.lastPos, pos) : 0;
    if (moved < 50) state.dist += moved;
    state.lastPos = pos; state.pos = pos;
    // 카메라 방향은 부드럽게 따라가기
    state.camBearing = (state.camBearing + angDiff(state.camBearing, heading) * 0.12 + 360) % 360;
    state.me.setLngLat(pos);
    const dt = Math.max((now - (state.lastUpdAt || now)) / 1000, 0.001);
    state.lastUpdAt = now;
    if (moved / dt > 0.8) state.lastMoveAt = now;              // 초속 0.8m 넘게 움직일 때만 '달리는 중' (GPS 흔들림 무시)
    state.meEl.classList.toggle("moving", now - (state.lastMoveAt || 0) < 2500);   // 2.5초 넘게 멈추면 선 자세
    if (!state.meShown) { state.me.addTo(map); state.meShown = true; }   // 위치를 넣은 뒤에 지도에 올림
    map.jumpTo({ center: pos, bearing: state.camBearing, pitch: state.is3d ? 62 : 0, zoom: 17.2 });

    if (now - (state.lastUi || 0) < 200) return;     // 화면 글씨는 1초에 5번만 갱신
    state.lastUi = now;

    // 지형 고도로 누적 오르막
    const alt = map.queryTerrainElevation ? map.queryTerrainElevation(pos) : null;
    if (alt != null && isFinite(alt)) {
      if (state.lastAlt != null && alt > state.lastAlt + 0.3) state.climb += alt - state.lastAlt;
      if (state.lastAlt == null || Math.abs(alt - state.lastAlt) > 0.3) state.lastAlt = alt;
    }

    // 진행 방향 다음 화장실 (앞쪽 ±70° 안에서 가장 가까운 곳, 없으면 가장 가까운 곳)
    let best = null, fallback = null;
    for (const t of state.toilets) {
      const d = haversine(pos, t.ll), b = bearing(pos, t.ll), rel = angDiff(heading, b);
      if (!fallback || d < fallback.d) fallback = { ...t, d, rel };
      if (Math.abs(rel) <= 70 && d <= 5000 && (!best || d < best.d)) best = { ...t, d, rel };
    }
    const target = best || fallback;
    state.toilets.forEach((t) => t.el.classList.toggle("next", target && t.el === target.el));
    if (target) {
      $("nextDist").textContent = fmtDist(target.d);
      $("nextName").textContent = `${best ? "앞쪽" : "뒤쪽"} 화장실 · ${target.name || "공중화장실"}`;
      $("nextEta").innerHTML = `약 ${Math.max(1, Math.round(target.d / 1000 * RUN_PACE_SEC / 60))}분<br>직선거리`;
      $("arrow").style.transform = `rotate(${target.rel}deg)`;
    } else {
      $("nextDist").textContent = "–"; $("nextName").textContent = "근처 화장실 정보 없음"; $("nextEta").textContent = "";
    }

    // 지금 달리는 길 (내 위치 주변 선 정보)
    const p = map.project(pos);
    const fs = map.queryRenderedFeatures([[p.x - 14, p.y - 14], [p.x + 14, p.y + 14]], { layers: ["run-inner"] });
    if (fs.length) {
      const f = fs[0].properties;
      const [rn, rc] = RUN[f.r] || ["길", "#888"];
      $("roadChip").textContent = rn; $("roadChip").style.background = state.mode === "slope" ? SLOPE[f.s][1] : rc;
      const g = f.g === null || f.g === undefined || f.g === "null" ? "" : ` (${Math.abs(+f.g).toFixed(1)}%)`;
      $("roadTxt").textContent = `${SLOPE[f.s][0].split(" ")[0]}${g}${f.n ? " · " + f.n : ""}`;
    } else {
      $("roadChip").textContent = "길 밖"; $("roadChip").style.background = "#868e96"; $("roadTxt").textContent = "러닝 길 정보가 없는 곳이에요";
    }

    const elapsed = (now - state.startTime) / 1000 * (state.nav === "demo" ? 4 : 1);
    $("sDist").textContent = (state.dist / 1000).toFixed(2);
    $("sPace").textContent = state.dist > 30 ? fmtPace(elapsed / (state.dist / 1000)) : "–";
    $("sClimb").textContent = Math.round(state.climb);
  }

  // ---------- 데모 주행 ----------
  function startDemo() {
    if (state.nav) stopNav();
    const route = state.route, cum = [0];
    for (let i = 1; i < route.length; i++) cum.push(cum[i - 1] + haversine(route[i - 1], route[i]));
    const total = cum[cum.length - 1];
    const at = (s) => {
      s = Math.min(Math.max(s, 0), total);
      let i = 1; while (i < cum.length - 1 && cum[i] < s) i++;
      const t = (s - cum[i - 1]) / Math.max(cum[i] - cum[i - 1], 1e-6);
      return [route[i - 1][0] + (route[i][0] - route[i - 1][0]) * t, route[i - 1][1] + (route[i][1] - route[i - 1][1]) * t];
    };
    beginNav("demo");
    state.map.setLayoutProperty("demo-glow", "visibility", "visible");
    state.camBearing = bearing(at(0), at(25));
    let s = 0, last = performance.now();
    const step = (now) => {
      s += DEMO_SPEED * (now - last) / 1000; last = now;
      if (s >= total) { toast(`데모 주행 끝! ${(total / 1000).toFixed(1)}km`); return stopNav(); }
      const pos = at(s), ahead = at(s + 25);
      update(pos, bearing(pos, ahead), now);
      state.raf = requestAnimationFrame(step);
    };
    state.raf = requestAnimationFrame(step);
    toast("데모: 실제 속도의 4배로 달려요");
  }

  // ---------- 실제 GPS ----------
  function startGps() {
    if (!("geolocation" in navigator)) return toast("이 기기에서는 위치를 쓸 수 없어요");
    if (state.nav) stopNav();
    let started = false, prev = null, heading = 0;
    state.watchId = navigator.geolocation.watchPosition((p) => {
      const pos = [p.coords.longitude, p.coords.latitude];
      const b = state.meta.bounds;
      if (!started) {
        if (pos[0] < b[0] - .02 || pos[0] > b[2] + .02 || pos[1] < b[1] - .02 || pos[1] > b[3] + .02) {
          toast(`지금 위치는 ${state.meta.label} 지도 밖이에요. 데모 주행으로 확인해 보세요.`, 6000);
          navigator.geolocation.clearWatch(state.watchId); state.watchId = null; return;
        }
        beginNav("gps"); started = true;
      }
      if (p.coords.heading != null && !isNaN(p.coords.heading) && (p.coords.speed || 0) > 0.6) heading = p.coords.heading;
      else if (prev && haversine(prev, pos) > 4) heading = bearing(prev, pos);
      if (!prev || haversine(prev, pos) > 4) prev = pos;
      update(pos, heading, performance.now());
    }, (err) => {
      toast(err.code === 1 ? "위치 권한을 허용해 주세요 (브라우저 설정)" : "위치를 찾지 못했어요");
      if (state.nav === "gps") stopNav();
    }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 });
  }

  // ---------- 앱처럼 설치 ----------
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
